<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Waktu Gamma - Atheria Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #5C9BCB;
            font-family: 'Montserrat', sans-serif;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* --- Header & Dropdown --- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-top: 10px;
            position: relative;
            z-index: 100;
        }

        .header-text h1 {
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .header-text h2 {
            font-size: 0.9rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.95;
        }

        .custom-select-wrapper {
            position: relative;
            user-select: none;
            width: 130px;
        }

        .custom-select-trigger {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 12px;
            padding: 8px 12px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .arrow {
            width: 0;
            height: 0;
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid #FFFFFF;
            transition: transform 0.3s ease;
        }

        .custom-select-wrapper.open .arrow { transform: rotate(180deg); }

        .custom-options {
            position: absolute;
            top: 110%;
            right: 0;
            width: 160px;
            background: rgba(65, 115, 155, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            opacity: 0;
            visibility: hidden;
            transform: translateY(-10px);
            transition: all 0.3s ease;
            max-height: 250px;
            overflow-y: auto;
            z-index: 1000;
        }

        .custom-options::-webkit-scrollbar { width: 5px; }
        .custom-options::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        .custom-select-wrapper.open .custom-options {
            opacity: 1;
            visibility: visible;
            transform: translateY(0);
        }

        .custom-option {
            padding: 10px 12px;
            font-size: 0.75rem;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .custom-option:hover { background: rgba(255, 255, 255, 0.2); }
        .custom-option.selected { background: #FFE07D; color: #333; font-weight: 700; }

        /* --- Bagian Tengah (FLIP CLOCK) --- */
        .time-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin: 20px 0;
            position: relative;
            z-index: 1;
        }

        .time-block {
            display: flex;
            align-items: center;
            justify-content: flex-start;
        }

        .label-group {
            width: 65px; /* Lebar label dikunci */
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding-right: 10px;
            flex-shrink: 0;
        }

        .label-id { font-size: 0.95rem; font-weight: 700; line-height: 1.2; }
        .label-en { font-size: 0.75rem; font-weight: 400; }

        /* --- PERBAIKAN FLIP CLOCK --- */
        .flip-clock-container {
            display: flex;
            gap: 8px;
            flex-grow: 1; /* Agar mengisi sisa ruang */
        }

        .flip-unit {
            position: relative;
            /* Ukuran kotak responsif */
            width: calc(50% - 4px); 
            max-width: 110px;
            /* Tinggi kotak disesuaikan dengan font */
            aspect-ratio: 3 / 4; 
            border-radius: 8px;
            background: #4a81ab;
            font-family: 'Oswald', sans-serif;
            font-size: 7rem; /* Ukuran font dasar */
            line-height: 1;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .flip-unit.minute { background: #E5B84D; }

        /* Bagian kertas flip */
        .flip-unit .top, 
        .flip-unit .bottom, 
        .flip-unit .top-flip, 
        .flip-unit .bottom-flip {
            position: absolute;
            left: 0;
            width: 100%;
            height: 50%;
            overflow: hidden;
            display: flex;
            justify-content: center;
            color: #FFFFFF;
        }

        .flip-unit.minute .top, 
        .flip-unit.minute .bottom, 
        .flip-unit.minute .top-flip, 
        .flip-unit.minute .bottom-flip {
            color: #FFE07D;
        }

        /* Setengah Atas */
        .flip-unit .top, 
        .flip-unit .top-flip {
            top: 0;
            align-items: flex-end;
            border-bottom: 1px solid rgba(0,0,0,0.15);
            border-radius: 8px 8px 0 0;
            background: rgba(0,0,0,0.05); /* Sedikit bayangan */
        }

        /* Setengah Bawah */
        .flip-unit .bottom, 
        .flip-unit .bottom-flip {
            bottom: 0;
            align-items: flex-start;
            border-radius: 0 0 8px 8px;
        }

        /* Posisi angka di tengah potongan */
        .flip-unit .top span, 
        .flip-unit .bottom span {
            transform: translateY(50%);
            display: block;
        }

        /* Animasi Flip */
        .flip-unit .top-flip {
            transform-origin: bottom;
            transform: rotateX(0deg);
            z-index: 2;
        }

        .flip-unit .bottom-flip {
            transform-origin: top;
            transform: rotateX(90deg);
            z-index: 1;
        }

        .flip-unit.flipping .top-flip {
            animation: flip-top 0.3s ease-in forwards;
        }

        .flip-unit.flipping .bottom-flip {
            animation: flip-bottom 0.3s 0.3s ease-out forwards;
        }

        @keyframes flip-top {
            0% { transform: rotateX(0deg); }
            100% { transform: rotateX(-90deg); }
        }

        @keyframes flip-bottom {
            0% { transform: rotateX(90deg); }
            100% { transform: rotateX(0deg); }
        }

        .divider {
            width: 100%;
            height: 2px;
            background-color: #FFFFFF;
            margin: 15px 0;
            opacity: 0.9;
        }

        /* --- Bagian Bawah (Hari & Tanggal) --- */
        .date-section {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
            position: relative;
            z-index: 1;
        }

        .date-box {
            border: 2px solid #FFFFFF;
            padding: 10px 8px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .date-box.hari { flex: 1; font-size: 1rem; font-weight: 700; }
        .date-box.tanggal { flex: 2; font-size: 1rem; font-weight: 700; }

        .status-indicator {
            text-align: center;
            font-size: 0.7rem;
            margin-top: 15px;
            opacity: 0.8;
            letter-spacing: 0.1em;
        }

        /* Responsif Font */
        @media (max-width: 400px) {
            .flip-unit { font-size: 5rem; }
            .label-group { width: 55px; }
            .label-id { font-size: 0.8rem; }
            .label-en { font-size: 0.65rem; }
        }
        
        @media (max-width: 320px) {
            .flip-unit { font-size: 4rem; }
            .header-text h1 { font-size: 1.2rem; }
            .custom-select-wrapper { width: 110px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-text">
                <h1>ZONA WAKTU GAMMA</h1>
                <h2 id="negara-label">TRITINIA</h2>
            </div>
            
            <!-- CUSTOM DROPDOWN -->
            <div class="custom-select-wrapper" id="dropdown-wrapper">
                <div class="custom-select-trigger" id="dropdown-trigger">
                    <span id="selected-text">Tritinia</span>
                    <div class="arrow"></div>
                </div>
                <div class="custom-options" id="dropdown-options">
                    <div class="custom-option" data-value="-2">Big Land</div>
                    <div class="custom-option" data-value="-1">Sarta (Ekslave)</div>
                    <div class="custom-option" data-value="-1">Etinal</div>
                    <div class="custom-option selected" data-value="0">Tritinia</div>
                    <div class="custom-option" data-value="0">Abkozia</div>
                    <div class="custom-option" data-value="0">Sarta (Daratan)</div>
                    <div class="custom-option" data-value="1">Hensand</div>
                    <div class="custom-option" data-value="1">Mosvoire</div>
                    <div class="custom-option" data-value="1">Casenia</div>
                    <div class="custom-option" data-value="1">Lespyia</div>
                    <div class="custom-option" data-value="2">Aljazar</div>
                    <div class="custom-option" data-value="2">Trebisi</div>
                </div>
            </div>
        </div>

        <!-- Waktu (Flip Clock) -->
        <div class="time-section">
            <!-- Blok Jam -->
            <div class="time-block">
                <div class="label-group">
                    <span class="label-id">JAM</span>
                    <span class="label-en">HOURS</span>
                </div>
                <div class="flip-clock-container">
                    <!-- Digit Jam Puluhan -->
                    <div class="flip-unit" id="jam-1">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="top-flip"><span>0</span></div>
                        <div class="bottom-flip"><span>0</span></div>
                    </div>
                    <!-- Digit Jam Satuan -->
                    <div class="flip-unit" id="jam-2">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="top-flip"><span>0</span></div>
                        <div class="bottom-flip"><span>0</span></div>
                    </div>
                </div>
            </div>

            <div class="divider"></div>

            <!-- Blok Menit -->
            <div class="time-block">
                <div class="label-group">
                    <span class="label-id">MENIT</span>
                    <span class="label-en">MINUTE</span>
                </div>
                <div class="flip-clock-container">
                    <!-- Digit Menit Puluhan -->
                    <div class="flip-unit minute" id="menit-1">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="top-flip"><span>0</span></div>
                        <div class="bottom-flip"><span>0</span></div>
                    </div>
                    <!-- Digit Menit Satuan -->
                    <div class="flip-unit minute" id="menit-2">
                        <div class="top"><span>0</span></div>
                        <div class="bottom"><span>0</span></div>
                        <div class="top-flip"><span>0</span></div>
                        <div class="bottom-flip"><span>0</span></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Status -->
        <div class="status-indicator" id="status">MENUNGGU WAKTU MULAI...</div>

        <!-- Tanggal -->
        <div class="date-section">
            <div class="date-box hari" id="hari">Minggu</div>
            <div class="date-box tanggal" id="tanggal">1 November 2026</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================
            // KONFIGURASI
            // ============================================
            const START_YEAR = 2026;
            const START_MONTH = 11;
            const START_DAY = 1;
            
            const REAL_START_DATE = new Date(2026, 9, 18, 12, 0, 0); 
            const REAL_START_TIMESTAMP = REAL_START_DATE.getTime();

            const REAL_MS_PER_FICTIONAL_MINUTE = 8000; 

            const startDateUTC = new Date(Date.UTC(START_YEAR, START_MONTH - 1, START_DAY, 0, 0, 0, 0));
            const startTimestampUTC = startDateUTC.getTime();

            // ============================================
            // REFERENSI DOM & STATE
            // ============================================
            const elHari = document.getElementById('hari');
            const elTanggal = document.getElementById('tanggal');
            const elStatus = document.getElementById('status');
            const elNegaraLabel = document.getElementById('negara-label');

            const dropdownWrapper = document.getElementById('dropdown-wrapper');
            const dropdownTrigger = document.getElementById('dropdown-trigger');
            const dropdownOptions = document.getElementById('dropdown-options');
            const selectedText = document.getElementById('selected-text');

            let currentOffset = 0;

            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

            // ============================================
            // LOGIKA FLIP CLOCK (BARU & LEBIH STABIL)
            // ============================================
            let currentDigits = { jam1: '0', jam2: '0', menit1: '0', menit2: '0' };

            function setDigit(elementId, newValue) {
                const unit = document.getElementById(elementId);
                const top = unit.querySelector('.top span');
                const bottom = unit.querySelector('.bottom span');
                const topFlip = unit.querySelector('.top-flip span');
                const bottomFlip = unit.querySelector('.bottom-flip span');

                // Jika angka sama, jangan beranimasi
                if (top.innerText === newValue) return;

                const oldValue = top.innerText;

                // Set angka lama untuk animasi atas, dan angka baru untuk animasi bawah
                topFlip.innerText = oldValue;
                bottomFlip.innerText = newValue;

                // Set angka baru untuk bagian yang diam (belakang)
                bottom.innerText = newValue;

                // Jalankan animasi
                unit.classList.add('flipping');

                // Setelah 0.6 detik (sesuai durasi CSS), kembalikan ke posisi semula
                setTimeout(() => {
                    top.innerText = newValue;
                    unit.classList.remove('flipping');
                }, 600); 
            }

            function updateFlipClock(hour, minute) {
                const hStr = String(hour).padStart(2, '0');
                const mStr = String(minute).padStart(2, '0');

                setDigit('jam-1', hStr[0]);
                setDigit('jam-2', hStr[1]);
                setDigit('menit-1', mStr[0]);
                setDigit('menit-2', mStr[1]);
            }

            // ============================================
            // LOGIKA DROPDOWN
            // ============================================
            dropdownTrigger.addEventListener('click', function(e) {
                e.stopPropagation();
                dropdownWrapper.classList.toggle('open');
            });

            const options = dropdownOptions.querySelectorAll('.custom-option');
            options.forEach(option => {
                option.addEventListener('click', function(e) {
                    e.stopPropagation();
                    
                    options.forEach(opt => opt.classList.remove('selected'));
                    this.classList.add('selected');
                    
                    const text = this.innerText;
                    const val = parseInt(this.getAttribute('data-value'));
                    
                    selectedText.innerText = text;
                    elNegaraLabel.innerText = text.toUpperCase();
                    currentOffset = val;
                    
                    dropdownWrapper.classList.remove('open');
                    updateClock(true);
                });
            });

            document.addEventListener('click', function() {
                dropdownWrapper.classList.remove('open');
            });

            // ============================================
            // UPDATE TAMPILAN UTAMA
            // ============================================
            function updateClock(forceUpdate = false) {
                const nowReal = Date.now();
                let hour = 0, minute = 0;

                if (nowReal < REAL_START_TIMESTAMP) {
                    elStatus.textContent = "MENUNGGU 18 OKT 2026 12:00...";
                    elStatus.style.color = "#FFFFFF";
                    
                    const offsetMs = currentOffset * 60 * 60 * 1000;
                    const startDisplay = new Date(startTimestampUTC + offsetMs);
                    
                    elHari.textContent = namaHari[startDisplay.getUTCDay()];
                    elTanggal.textContent = `${startDisplay.getUTCDate()} ${namaBulan[startDisplay.getUTCMonth()]} ${startDisplay.getUTCFullYear()}`;
                    
                    hour = startDisplay.getUTCHours();
                    minute = startDisplay.getUTCMinutes();
                } else {
                    elStatus.textContent = "SISTEM BERJALAN (8s = 1m)";
                    elStatus.style.color = "#a0ffb0";

                    const elapsedRealMs = nowReal - REAL_START_TIMESTAMP;
                    const fictionalMinutesTotal = elapsedRealMs / REAL_MS_PER_FICTIONAL_MINUTE;
                    const fictionalMs = fictionalMinutesTotal * 60000;
                    
                    const offsetMs = currentOffset * 60 * 60 * 1000;
                    const fictionalDate = new Date(startTimestampUTC + fictionalMs + offsetMs);

                    hour = fictionalDate.getUTCHours();
                    minute = fictionalDate.getUTCMinutes();
                    
                    elHari.textContent = namaHari[fictionalDate.getUTCDay()];
                    elTanggal.textContent = `${fictionalDate.getUTCDate()} ${namaBulan[fictionalDate.getUTCMonth()]} ${fictionalDate.getUTCFullYear()}`;
                }

                const hStr = String(hour).padStart(2, '0');
                const mStr = String(minute).padStart(2, '0');
                
                // Hanya update jika berubah atau dipaksa (ganti negara)
                if (forceUpdate || currentDigits.jam1 !== hStr[0] || currentDigits.jam2 !== hStr[1] || 
                    currentDigits.menit1 !== mStr[0] || currentDigits.menit2 !== mStr[1]) {
                    
                    updateFlipClock(hour, minute);
                    
                    currentDigits = {
                        jam1: hStr[0], jam2: hStr[1],
                        menit1: mStr[0], menit2: mStr[1]
                    };
                }
            }

            // Inisialisasi
            updateClock(true);
            setInterval(updateClock, 100); 

            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) updateClock(true);
            });

        })();
    </script>
</body>
</html>
