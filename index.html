<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zona Waktu Gamma</title>
    <style>
        /* Menggunakan font sans-serif modern yang mirip dengan gambar */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #5C9BCB; /* Warna biru sesuai gambar */
            font-family: 'Montserrat', sans-serif;
            color: #FFFFFF;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 100vh;
        }

        /* --- Bagian Header --- */
        .header {
            text-align: left;
            margin-top: 20px;
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
            line-height: 1.1;
        }

        .header h2 {
            font-size: 1.2rem;
            font-weight: 400;
            letter-spacing: 0.5px;
            opacity: 0.95;
        }

        /* --- Bagian Tengah (Jam & Menit) --- */
        .time-section {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        .time-block {
            display: flex;
            align-items: center;
            justify-content: flex-start;
            position: relative;
        }

        /* Label di kiri (JAM / HOURS) */
        .label-group {
            width: 90px;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            text-align: right;
            padding-right: 20px;
            z-index: 2;
        }

        .label-id {
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .label-en {
            font-size: 1rem;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        /* Angka besar */
        .number {
            font-size: 12rem;
            font-weight: 800;
            line-height: 0.8;
            letter-spacing: -2px;
            color: #FFFFFF;
        }

        .number.minute {
            color: #FFE07D; /* Warna kuning sesuai gambar */
        }

        /* Garis pemisah */
        .divider {
            width: 100%;
            height: 2px;
            background-color: #FFFFFF;
            margin: 10px 0 25px 0;
            opacity: 0.9;
        }

        /* --- Bagian Bawah (Hari & Tanggal) --- */
        .date-section {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .date-box {
            border: 2px solid #FFFFFF;
            padding: 12px 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .date-box.hari {
            flex: 1;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .date-box.tanggal {
            flex: 2.5;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* Responsif untuk layar lebih kecil */
        @media (max-width: 420px) {
            .container {
                padding: 30px 20px;
            }
            .header h1 { font-size: 1.6rem; }
            .header h2 { font-size: 1rem; }
            .number { font-size: 9rem; }
            .label-group { width: 75px; padding-right: 10px; }
            .label-id { font-size: 1rem; }
            .label-en { font-size: 0.85rem; }
            .date-box.hari, .date-box.tanggal { font-size: 1.1rem; padding: 10px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>ZONA WAKTU GAMMA</h1>
            <h2>GAMMA TIME ZONE</h2>
        </div>

        <!-- Waktu -->
        <div class="time-section">
            <!-- Blok Jam -->
            <div class="time-block">
                <div class="label-group">
                    <span class="label-id">JAM</span>
                    <span class="label-en">HOURS</span>
                </div>
                <div class="number" id="jam">06</div>
            </div>

            <!-- Garis Pemisah -->
            <div class="divider"></div>

            <!-- Blok Menit -->
            <div class="time-block">
                <div class="label-group">
                    <span class="label-id">MENIT</span>
                    <span class="label-en">MINUTE</span>
                </div>
                <div class="number minute" id="menit">25</div>
            </div>
        </div>

        <!-- Tanggal -->
        <div class="date-section">
            <div class="date-box hari" id="hari">Senin</div>
            <div class="date-box tanggal" id="tanggal">1 November 2026</div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================
            // KONFIGURASI WAKTU FIKSI
            // ============================================
            // Mulai: 1 November 2026, jam 00:00
            const START_YEAR = 2026;
            const START_MONTH = 11;   // November (1-based)
            const START_DAY = 1;
            const START_HOUR = 0;
            const START_MINUTE = 0;

            // Kecepatan: 8 detik dunia nyata = +1 menit fiksi
            const REAL_MS_PER_FICTIONAL_MINUTE = 8000; 

            // Waktu mulai dalam epoch (UTC)
            const startDate = new Date(Date.UTC(START_YEAR, START_MONTH - 1, START_DAY, START_HOUR, START_MINUTE, 0, 0));
            const startTimestamp = startDate.getTime();

            // ============================================
            // REFERENSI DOM
            // ============================================
            const elJam = document.getElementById('jam');
            const elMenit = document.getElementById('menit');
            const elHari = document.getElementById('hari');
            const elTanggal = document.getElementById('tanggal');

            // Array nama hari dan bulan
            const namaHari = ['Minggu', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
            const namaBulan = ['Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];

            // ============================================
            // UPDATE TAMPILAN
            // ============================================
            function updateClock() {
                const nowReal = Date.now();
                const elapsedRealMs = nowReal - startTimestamp;

                // Hitung total menit fiksi yang berlalu
                const fictionalMinutesTotal = elapsedRealMs / REAL_MS_PER_FICTIONAL_MINUTE;

                // Konversi ke milidetik fiksi dan tambahkan ke waktu mulai
                const fictionalMs = fictionalMinutesTotal * 60000;
                const fictionalDate = new Date(startTimestamp + fictionalMs);

                // Ekstrak komponen waktu (UTC agar tidak terpengaruh timezone device)
                const day = fictionalDate.getUTCDate();
                const month = fictionalDate.getUTCMonth();
                const year = fictionalDate.getUTCFullYear();
                const hour = fictionalDate.getUTCHours();
                const minute = fictionalDate.getUTCMinutes();
                const dayOfWeek = fictionalDate.getUTCDay();

                // Update DOM
                elJam.textContent = String(hour).padStart(2, '0');
                elMenit.textContent = String(minute).padStart(2, '0');
                
                elHari.textContent = namaHari[dayOfWeek];
                elTanggal.textContent = `${day} ${namaBulan[month]} ${year}`;
            }

            // Jalankan pertama kali
            updateClock();

            // Update setiap 100ms agar pergerakan menit terasa halus
            setInterval(updateClock, 100);

            // Pastikan sinkron saat tab kembali dibuka
            document.addEventListener('visibilitychange', function() {
                if (!document.hidden) {
                    updateClock();
                }
            });

        })();
    </script>
</body>
</html>
